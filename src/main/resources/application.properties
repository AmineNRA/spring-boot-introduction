spring.application.name=sa-backend

#Tomcat configuration
server.port=5323

#Log level configuration

logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN
logging.level.com.openclassrooms=INFO

#Database Postgresql configuration

spring.datasource.url=jdbc:postgresql://localhost:5432/sa
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.servlet.context-path=/api

# Active l'exécution automatique de schema.sql et data.sql
spring.sql.init.mode=always

# Diffère l'initialisation de la datasource si besoin
spring.jpa.defer-datasource-initialization=true

pring.jpa.hibernate.ddl-auto=none

spring.config.import=optional:file:.env[.properties]